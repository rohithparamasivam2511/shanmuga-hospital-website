<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" fill="none" width="100%" height="100%">
  <!-- Icon Emblem -->
  <g transform="translate(4, 5)">
    <!-- Rounded Shield Background -->
    <rect x="0" y="0" width="58" height="58" rx="14" fill="url(#brandGradWhite)" />
    <!-- Medical Cross -->
    <path d="M29 14V44M14 29H44" stroke="#0F2744" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center Heart Accent -->
    <circle cx="29" cy="29" r="4.5" fill="#0D9488"/>
  </g>

  <!-- Typography -->
  <text x="74" y="27" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">
    KAVIN <tspan fill="#2DD4BF">MEDICAL</tspan>
  </text>
  <text x="74" y="44" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="0.12em">
    CENTER <tspan fill="#38BDF8" font-size="10" font-weight="600">• ERODE</tspan>
  </text>
  <text x="74" y="58" font-family="'Mukta Malar', sans-serif" font-size="11" font-weight="700" fill="#CBD5E1">
    கவின் மருத்துவ மையம்
  </text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="brandGradWhite" x1="0" y1="0" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
</svg>
